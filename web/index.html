<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Title & SEO Metadata -->
    <title>KafkaShop | Event-Driven E-Commerce Platform</title>
    <meta
      name="description"
      content="KafkaShop is a high-performance event-driven e-commerce platform powered by Apache Kafka, Redis distributed idempotency, Elasticsearch, and real-time SSE streaming."
    />
    <meta name="author" content="KafkaShop Team" />
    <meta name="theme-color" content="#0e131f" />

    <!-- Favicons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (Facebook, LinkedIn, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KafkaShop" />
    <meta property="og:title" content="KafkaShop | Event-Driven E-Commerce Platform" />
    <meta
      property="og:description"
      content="Real-time event-driven e-commerce platform communicating asynchronously via Apache Kafka, Redis idempotency, and Elasticsearch."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="KafkaShop Event-Driven Platform Banner" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KafkaShop | Event-Driven E-Commerce Platform" />
    <meta
      name="twitter:description"
      content="Real-time event-driven e-commerce platform communicating asynchronously via Apache Kafka, Redis idempotency, and Elasticsearch."
    />
    <meta name="twitter:image" content="/og-image.png" />

  </body>
