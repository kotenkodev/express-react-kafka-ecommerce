<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111728" />
      <stop offset="100%" stop-color="#16152b" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Vibrant Brand Accent Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Wheel / Node Accent Gradient -->
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cartGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Ambient Radial Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Squircle Badge -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#ambientGlow)" />
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" ry="110.5" fill="none" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Subtle Event Stream Wave in Background -->
  <path d="M 64 256 C 140 210, 200 300, 290 240 C 350 200, 400 240, 448 220" 
        fill="none" 
        stroke="#6366f1" 
        stroke-width="3" 
        stroke-opacity="0.25" 
        stroke-dasharray="8 8" />

  <!-- Main Symbol: High-Tech Shopping Cart + Kafka Event Stream Nodes -->
  <g filter="url(#cartGlow)">
    <!-- Cart Frame: Bold, smooth rounded joints -->
    <path d="M 112 152 L 160 152 L 208 316 L 368 316 L 408 196 L 176 196"
          fill="none"
          stroke="url(#brandGrad)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Stream Pulse 1: Top data flow line -->
    <path d="M 224 236 L 344 236"
          fill="none"
          stroke="#38bdf8"
          stroke-width="14"
          stroke-linecap="round"
          stroke-opacity="0.95" />

    <!-- Stream Pulse 2: Middle data flow line -->
    <path d="M 240 274 L 320 274"
          fill="none"
          stroke="#a855f7"
          stroke-width="12"
          stroke-linecap="round"
          stroke-opacity="0.9" />

    <!-- Spark Node at cart leading edge -->
    <circle cx="408" cy="196" r="14" fill="#38bdf8" />
    <circle cx="408" cy="196" r="6" fill="#ffffff" />

    <!-- Wheel Node 1 (Kafka Broker Event Node) -->
    <circle cx="232" cy="384" r="28" fill="url(#wheelGrad)" />
    <circle cx="232" cy="384" r="18" fill="#0b0f19" />
    <circle cx="232" cy="384" r="10" fill="#ffffff" />

    <!-- Wheel Node 2 (Kafka Broker Event Node) -->
    <circle cx="352" cy="384" r="28" fill="url(#brandGrad)" />
    <circle cx="352" cy="384" r="18" fill="#0b0f19" />
    <circle cx="352" cy="384" r="10" fill="#ffffff" />
  </g>
</svg>