networks:
  kafka-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  redisinsight_data:
  es_data:
  prometheus_data:
  grafana_data:
  api_gateway_modules:
  auth_service_modules:
  product_service_modules:
  order_service_modules:
  payment_service_modules:
  delivery_service_modules:
  analytics_service_modules:
  search_service_modules:

services:
  # --- INFRASTRUCTURE: MESSAGE BROKER ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks: [kafka-net]
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT:-2181}
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    networks: [kafka-net]
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    networks: [kafka-net]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      cub kafka-ready -b kafka:29092 1 20
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --topic orders
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --topic payments
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --topic order.status.updated
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --topic order.dlq
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic order.status.updated.dlq
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --topic order.stats
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks: [kafka-net]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # --- INFRASTRUCTURE: DATABASES & CACHE ---
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    networks: [kafka-net]
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-kafkashop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-kafkashop}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    networks: [kafka-net]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      DB_NAME: ${POSTGRES_DB:-kafkashop}
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-2000}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-25}
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-50}
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -p 6432 -U ${POSTGRES_USER:-admin} || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    networks: [kafka-net]
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    networks: [kafka-net]
    restart: unless-stopped
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

  # --- INFRASTRUCTURE: SEARCH ENGINE ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    networks: [kafka-net]
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -s -f http://localhost:9200/_cat/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 40s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    networks: [kafka-net]
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

  # --- INFRASTRUCTURE: MONITORING ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks: [kafka-net]
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks: [kafka-net]
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/ecommerce-dashboard.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --- MICROSERVICES ---
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
      target: dev
    container_name: auth-service
    networks: [kafka-net]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${AUTH_SERVICE_PORT:-3006}:${AUTH_SERVICE_PORT:-3006}"
    environment:
      PORT: ${AUTH_SERVICE_PORT:-3006}
      TRUST_PROXY: loopback,uniquelocal
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@pgbouncer:6432/${POSTGRES_DB:-kafkashop}?schema=public&pgbouncer=true
      DIRECT_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/${POSTGRES_DB:-kafkashop}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-secret123}
    volumes:
      - ./services/auth-service/src:/app/services/auth-service/src
      - ./services/auth-service/tsconfig.json:/app/services/auth-service/tsconfig.json:ro
      - ./shared/dist:/app/shared/dist:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${AUTH_SERVICE_PORT:-3006}/health | grep -q ok || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
      target: dev
    container_name: product-service
    networks: [kafka-net]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    ports:
      - "${PRODUCT_SERVICE_PORT:-3007}:${PRODUCT_SERVICE_PORT:-3007}"
    environment:
      PORT: ${PRODUCT_SERVICE_PORT:-3007}
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@pgbouncer:6432/${POSTGRES_DB:-kafkashop}?schema=public&pgbouncer=true
      DIRECT_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/${POSTGRES_DB:-kafkashop}?schema=public
    volumes:
      - ./services/product-service/src:/app/services/product-service/src
      - ./services/product-service/tsconfig.json:/app/services/product-service/tsconfig.json:ro
      - ./shared/dist:/app/shared/dist:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${PRODUCT_SERVICE_PORT:-3007}/health | grep -q ok || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
      target: dev
    container_name: order-service
    networks: [kafka-net]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${ORDER_SERVICE_PORT:-3001}:${ORDER_SERVICE_PORT:-3001}"
    environment:
      PORT: ${ORDER_SERVICE_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@pgbouncer:6432/${POSTGRES_DB:-kafkashop}?schema=public&pgbouncer=true
      DIRECT_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/${POSTGRES_DB:-kafkashop}?schema=public
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://redis:6379
    volumes:
      - ./services/order-service/src:/app/services/order-service/src
      - ./services/order-service/tsconfig.json:/app/services/order-service/tsconfig.json:ro
      - ./shared/dist:/app/shared/dist:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${ORDER_SERVICE_PORT:-3001}/health | grep -q ok || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
      target: dev
    container_name: payment-service
    networks: [kafka-net]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${PAYMENT_SERVICE_PORT:-3002}:${PAYMENT_SERVICE_PORT:-3002}"
    environment:
      PORT: ${PAYMENT_SERVICE_PORT:-3002}
      KAFKA_BROKERS: kafka:29092
    volumes:
      - ./services/payment-service/src:/app/services/payment-service/src
      - ./services/payment-service/tsconfig.json:/app/services/payment-service/tsconfig.json:ro
      - ./shared/dist:/app/shared/dist:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${PAYMENT_SERVICE_PORT:-3002}/health | grep -q ok || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  delivery-service:
    build:
      context: .
      dockerfile: services/delivery-service/Dockerfile
      target: dev
    container_name: delivery-service
    networks: [kafka-net]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${DELIVERY_SERVICE_PORT:-3003}:${DELIVERY_SERVICE_PORT:-3003}"
    environment:
      PORT: ${DELIVERY_SERVICE_PORT:-3003}
      KAFKA_BROKERS: kafka:29092
    volumes:
      - ./services/delivery-service/src:/app/services/delivery-service/src
      - ./services/delivery-service/tsconfig.json:/app/services/delivery-service/tsconfig.json:ro
      - ./shared/dist:/app/shared/dist:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${DELIVERY_SERVICE_PORT:-3003}/health | grep -q ok || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
      target: dev
    container_name: analytics-service
    networks: [kafka-net]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${ANALYTICS_SERVICE_PORT:-3004}:${ANALYTICS_SERVICE_PORT:-3004}"
    environment:
      PORT: ${ANALYTICS_SERVICE_PORT:-3004}
      KAFKA_BROKERS: kafka:29092
    volumes:
      - ./services/analytics-service/src:/app/services/analytics-service/src
      - ./services/analytics-service/tsconfig.json:/app/services/analytics-service/tsconfig.json:ro
      - ./shared/dist:/app/shared/dist:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${ANALYTICS_SERVICE_PORT:-3004}/health | grep -q ok || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  search-service:
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
      target: dev
    container_name: search-service
    networks: [kafka-net]
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${SEARCH_SERVICE_PORT:-3005}:${SEARCH_SERVICE_PORT:-3005}"
    environment:
      PORT: ${SEARCH_SERVICE_PORT:-3005}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KAFKA_BROKERS: kafka:29092
    volumes:
      - ./services/search-service/src:/app/services/search-service/src
      - ./services/search-service/tsconfig.json:/app/services/search-service/tsconfig.json:ro
      - ./shared/dist:/app/shared/dist:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${SEARCH_SERVICE_PORT:-3005}/health | grep -q ok || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- ENTRYPOINT GATEWAY ---
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
      target: dev
    container_name: api-gateway
    networks: [kafka-net]
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    ports:
      - "${API_GATEWAY_PORT:-8000}:${API_GATEWAY_PORT:-8000}"
    environment:
      PORT: ${API_GATEWAY_PORT:-8000}
      TRUST_PROXY: loopback,uniquelocal
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-secret123}
      AUTH_SERVICE_URL: http://auth-service:3006
      ORDER_SERVICE_URL: http://order-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3007
      SEARCH_SERVICE_URL: http://search-service:3005
      ANALYTICS_SERVICE_URL: http://analytics-service:3004
    volumes:
      - ./services/api-gateway/src:/app/services/api-gateway/src
      - ./services/api-gateway/tsconfig.json:/app/services/api-gateway/tsconfig.json:ro
      - ./shared/dist:/app/shared/dist:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${API_GATEWAY_PORT:-8000}/health | grep -q ok || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- FRONTEND (REACT + VITE + NGINX) ---
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: web
    networks: [kafka-net]
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
