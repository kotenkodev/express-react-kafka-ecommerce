name: Deploy to EC2 (Self-Hosted Runner)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Write .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          chmod 600 .env

      - name: Docker Compose Down
        run: |
          docker compose -f docker-compose.prod.yml down --remove-orphans

      - name: Docker Compose Up & Build
        run: |
          docker compose -f docker-compose.prod.yml up --build -d

      - name: Verify Container Status
        run: |
          docker compose -f docker-compose.prod.yml ps

      - name: Migrate Database
        run: |
          docker compose -f docker-compose.prod.yml exec -T product-service npx prisma migrate deploy --schema=../../shared/prisma/schema.prisma

      - name: Seed Database
        run: |
          docker compose -f docker-compose.prod.yml exec -T product-service npm run db:seed
