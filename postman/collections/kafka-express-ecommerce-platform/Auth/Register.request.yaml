$kind: http-request
order: 1000
method: POST
url: '{{baseUrl}}/api/auth/register'
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "johndoe",
      "firstName": "John",
      "lastName": "Doe",
      "email": "john@example.com",
      "password": "Password1!"
    }
