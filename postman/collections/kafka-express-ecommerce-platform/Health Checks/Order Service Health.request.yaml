$kind: http-request
description: |-
  ### Order Service Health Check
  Pings the Order Service directly on port `3001` to verify operational status, Kafka producer readiness, and PostgreSQL connectivity.

  #### Responses:
  - `200 OK`: Returns `{ "status": "ok", "service": "order-service" }`.
order: 3000
method: GET
url: "{{orderServiceUrl}}/health"
auth:
  type: noauth

scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Order service is healthy", function () {
        const res = pm.response.json();
        pm.expect(res.status).to.eql("ok");
        pm.expect(res.service).to.eql("order-service");
      });
    language: text/javascript
