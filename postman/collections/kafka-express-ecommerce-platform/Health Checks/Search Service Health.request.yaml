$kind: http-request
description: |-
  ### Search Service Health Check
  Pings the Search Service directly on port `3005` to verify operational status and Elasticsearch client availability.

  #### Responses:
  - `200 OK`: Returns `{ "status": "ok", "service": "search-service" }`.
order: 5000
method: GET
url: "{{searchServiceUrl}}/health"
auth:
  type: noauth

scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Search service is healthy", function () {
        const res = pm.response.json();
        pm.expect(res.status).to.eql("ok");
        pm.expect(res.service).to.eql("search-service");
      });
    language: text/javascript
