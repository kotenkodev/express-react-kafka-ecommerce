$kind: http-request
order: 1000
method: GET
url: "{{baseUrl}}/health"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("API Gateway is healthy", function () {
        const res = pm.response.json();
        pm.expect(res.status).to.eql("ok");
        pm.expect(res.service).to.eql("api-gateway");
      });
    language: text/javascript
