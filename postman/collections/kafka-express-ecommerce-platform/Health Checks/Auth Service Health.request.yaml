$kind: http-request
description: |-
  ### Auth Service Health Check
  Pings the Auth Service directly on port `3006` to verify service readiness and database/Redis connectivity.

  #### Responses:
  - `200 OK`: Returns `{ "status": "ok", "service": "auth-service" }`.
order: 2000
method: GET
url: "{{authServiceUrl}}/health"
auth:
  type: noauth

scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Auth service is healthy", function () {
        const res = pm.response.json();
        pm.expect(res.status).to.eql("ok");
        pm.expect(res.service).to.eql("auth-service");
      });
    language: text/javascript
