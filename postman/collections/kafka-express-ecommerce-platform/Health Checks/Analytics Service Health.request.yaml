$kind: http-request
description: |-
  ### Analytics Service Health Check
  Pings the Analytics Service directly on port `3004` to verify metrics pipeline and sliding-window event aggregation health.

  #### Responses:
  - `200 OK`: Returns `{ "status": "ok", "service": "analytics-service" }`.
order: 6000
method: GET
url: "{{analyticsServiceUrl}}/health"
auth:
  type: noauth

scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Analytics service is healthy", function () {
        const res = pm.response.json();
        pm.expect(res.status).to.eql("ok");
        pm.expect(res.service).to.eql("analytics-service");
      });
    language: text/javascript
