$kind: http-request
description: |-
  ### Product Service Health Check
  Pings the Product Service directly on port `3007` to verify catalog service health and database availability.

  #### Responses:
  - `200 OK`: Returns `{ "status": "ok", "service": "product-service" }`.
order: 4000
method: GET
url: "{{productServiceUrl}}/health"
auth:
  type: noauth

scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Product service is healthy", function () {
        const res = pm.response.json();
        pm.expect(res.status).to.eql("ok");
        pm.expect(res.service).to.eql("product-service");
      });
    language: text/javascript
