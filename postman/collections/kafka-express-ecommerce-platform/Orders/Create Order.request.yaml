$kind: http-request
description: |-
  ### Create Order & Initiate Kafka Workflow
  Submits a customer order containing a list of product items and quantities. Saves the order to PostgreSQL in `PENDING` status and produces an `OrderCreatedEvent` to the Kafka `orders` topic.

  #### Asynchronous Microservices Chain:
  1. **Order Service**: Persists order with initial state `PENDING`, emits event to Kafka `orders` topic keyed by `orderId`.
  2. **Payment Service**: Consumes from `orders`, simulates 1–3s processing with 80% success rate, emits `PaymentProcessedEvent` to `payments` (or routes to `order.dlq` after 3 retries).
  3. **Delivery Service**: Consumes successful payments and advances order stages (PREPARING -> SHIPPED -> DELIVERED).
  4. **SSE Stream (`/api/events`)**: Pushes real-time status transitions to connected clients.

  #### Request Body Parameters:
  Array of order items:
  - `id` (UUID, required): Product ID.
  - `quantity` (integer, required): Positive quantity (`>= 1`).

  #### Responses:
  - `200 OK`: Order created (`{ id, userId, status: "PENDING", totalAmount, items: [...] }`).
  - `400 Bad Request`: Validation failure (empty items list, non-positive quantity, or product not found).
  - `401 Unauthorized`: Missing or invalid Bearer token.
order: 1000
method: POST
url: "{{baseUrl}}/api/orders"
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    [
      { "id": "{{productId}}", "quantity": 2 },
      { "id": "{{productId2}}", "quantity": 1 }
    ]
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Order created in PENDING state", function () {
        const res = pm.response.json();
        pm.expect(res).to.have.property("id");
        pm.expect(res).to.have.property("status");
        pm.expect(res.status).to.eql("PENDING");
        pm.expect(res).to.have.property("totalAmount");
        pm.expect(res).to.have.property("items");
        pm.expect(res.items).to.be.an("array");

        // Automatically store order ID for subsequent tracking requests
        pm.collectionVariables.set("orderId", res.id);
      });
    language: text/javascript
