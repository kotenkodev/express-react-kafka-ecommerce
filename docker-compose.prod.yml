networks:
  kafka-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  es_data:
  prometheus_data:
  grafana_data:

services:
  # --- INFRASTRUCTURE: MESSAGE BROKER ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks: [kafka-net]
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    networks: [kafka-net]
    restart: always
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 25s

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    networks: [kafka-net]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      cub kafka-ready -b kafka:29092 1 20
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic orders
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic payments
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic order.status.updated
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic order.dlq
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic order.status.updated.dlq
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic order.stats
      "

  # --- INFRASTRUCTURE: DATABASES & CACHE ---
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    networks: [kafka-net]
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    networks: [kafka-net]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-2000}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-25}
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-50}
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -p 6432 -U ${POSTGRES_USER} || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    networks: [kafka-net]
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- INFRASTRUCTURE: SEARCH ENGINE ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    networks: [kafka-net]
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -s -f http://localhost:9200/_cat/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 40s

  # --- INFRASTRUCTURE: MONITORING ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks: [kafka-net]
    restart: always
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks: [kafka-net]
    restart: always
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/ecommerce-dashboard.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --- MICROSERVICES (INTERNAL NETWORKING ONLY) ---
  # Clear development host bindings when this file is used as an override.
  auth-service:
    ports: !reset []
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    networks: [kafka-net]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3006
      TRUST_PROXY: loopback,uniquelocal
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}?schema=public&pgbouncer=true
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3006/health | grep -q ok || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  product-service:
    ports: !reset []
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: product-service
    networks: [kafka-net]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3007
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}?schema=public&pgbouncer=true
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3007/health | grep -q ok || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  order-service:
    ports: !reset []
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    networks: [kafka-net]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}?schema=public&pgbouncer=true
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://redis:6379
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3001/health | grep -q ok || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  payment-service:
    ports: !reset []
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: payment-service
    networks: [kafka-net]
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3002
      KAFKA_BROKERS: kafka:29092
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3002/health | grep -q ok || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  delivery-service:
    ports: !reset []
    build:
      context: .
      dockerfile: services/delivery-service/Dockerfile
    container_name: delivery-service
    networks: [kafka-net]
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3003
      KAFKA_BROKERS: kafka:29092
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3003/health | grep -q ok || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  analytics-service:
    ports: !reset []
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    container_name: analytics-service
    networks: [kafka-net]
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3004
      KAFKA_BROKERS: kafka:29092
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3004/health | grep -q ok || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  search-service:
    ports: !reset []
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
    container_name: search-service
    networks: [kafka-net]
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3005
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KAFKA_BROKERS: kafka:29092
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3005/health | grep -q ok || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  api-gateway:
    ports: !reset []
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    networks: [kafka-net]
    restart: always
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8000
      TRUST_PROXY: loopback,uniquelocal
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:3006
      ORDER_SERVICE_URL: http://order-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3007
      SEARCH_SERVICE_URL: http://search-service:3005
      ANALYTICS_SERVICE_URL: http://analytics-service:3004
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8000/health | grep -q ok || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- PRODUCTION INGRESS: WEB (NGINX + REACT SPA) ---
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: web
    networks: [kafka-net]
    restart: always
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
